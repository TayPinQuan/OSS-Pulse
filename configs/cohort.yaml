# Cohort, search sharding, download settings.
# All values validated by src/osspulse/config.py on load.

cohort:
  language: Python
  created_from: 2019-01-01
  created_to:   2021-12-31
  search_shard_by: month
  search_min_stars: 5
  search_max_stars_escalation: 10
  inclusion_min_stars_90d: 5
  inclusion_min_contributors_90d: 1
  inactivity_days: 180
  sample_size: 5421
  sample_seed: 42
  observation_end: 2019-12-31   # plan A: 3-year window, ~300 GB. Change to 2022-12-31 (plan A+) to keep 2021 cohort analysable.

download:
  source: gharchive_hourly
  url_template: "https://data.gharchive.org/{date}-{hour}.json.gz"
  keep_raw: false
  manifest_path: data/raw/gharchive/_download_manifest.jsonl
  max_parallel: 2
  retry_attempts: 3
  request_timeout_sec: 60.0

search_api:
  per_page: 100
  max_pages: 10
  min_interval_sec: 5.0

sources:
  pypi: pypistats
  ci_detection: gharchive_push

bots:
  known_logins:
    - dependabot
    - renovate
    - github-actions
    - codecov
    - greenkeeper
    - snyk-bot
    - pre-commit-ci
    - allcontributors
    - mergify
    - imgbot
    - restyled-io
    - pyup-bot
    - depfu
    - azure-pipelines
    - stale
    - welcome
    - cla-assistant
    - coveralls

logging:
  level: INFO